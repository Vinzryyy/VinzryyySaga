name: Refresh JKT48 Calendar

# Cron-scrape the fan-curated JKT48 events calendar (beritajkt48/event)
# and commit the resulting JSON back to the repo. Frontend reads
# /data/jkt48-calendar.json as a static asset — no runtime dependency
# on any external API.
#
# Triggers:
#   - schedule: every 6 hours (cron in UTC)
#   - workflow_dispatch: manual run from the Actions tab when needed

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC every day
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  # Allow the workflow to push the updated JSON back to the repo
  contents: write

concurrency:
  # Don't pile up multiple refreshes if a run is slow — newest wins
  group: refresh-calendar
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Scraper has no dependencies (uses Node's built-in fetch + fs),
      # so we skip `npm ci` to keep the job fast.
      - name: Scrape calendar
        run: node scripts/scrape-jkt48-calendar.js

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/jkt48-calendar.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/jkt48-calendar.json
          git commit -m "chore(calendar): refresh JKT48 events from beritajkt48 [skip ci]"
          git push
