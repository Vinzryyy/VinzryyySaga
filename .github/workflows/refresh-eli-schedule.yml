name: Refresh Eli Data

# Cron-scrape Eli's confirmed appearances, profile, active sales, and
# Eli-mention news from jkt48.com's public API and commit the resulting
# JSON back to the repo. Frontend reads each /data/*.json as a static
# asset.
#
# The /api/v1/schedules, /members, /exclusives, and /news endpoints are
# all public — no auth/cookie/token needed. Playwright launches a real
# Chromium browser to solve Cloudflare's bot challenge.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC every day
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-eli-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install scraper deps
        run: |
          pip install -r scripts/requirements.txt
          playwright install chromium --with-deps

      - name: Scrape Eli schedule
        run: python scripts/scrape-eli-schedule.py

      - name: Scrape Chekicha sessions
        # Separate platform (ckc.utaten.com) — Birthday Chekicha + 2shot
        # events that don't appear in the jkt48.com schedule. Run after
        # the main scrape so the Eli refresh proceeds even if Chekicha
        # is down. Non-fatal: workflow continues either way.
        run: python scripts/scrape-chekicha-eli.py
        continue-on-error: true

      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Stage every JSON the scraper writes — schedule, news (with
          # Eli-mention flags), profile, active sales, and Chekicha
          # sessions. Each refresh may touch any subset of these.
          git add \
            public/data/eli-schedule.json \
            public/data/eli-news.json \
            public/data/eli-member.json \
            public/data/eli-sales.json \
            public/data/chekicha-eli.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          # Compose a commit subject listing which files changed so the
          # log stays scannable when only one of the four moved.
          changed=$(git diff --cached --name-only | sed 's|public/data/||;s|\.json$||' | paste -sd ',' -)
          git commit -m "chore(data): refresh Eli data ($changed) from jkt48.com [skip ci]"
          git pull --rebase origin main
          git push
