name: Refresh Eli Schedule

# Cron-scrape Eli's confirmed appearances from jkt48.com via the
# authenticated API (using a long-lived NextAuth session cookie stored
# as the JKT48_SESSION_COOKIE repo secret) and commit the resulting
# JSON back to the repo. Frontend reads /data/eli-schedule.json as a
# static asset.
#
# How to refresh the cookie when scraper starts failing:
#   1. Login to jkt48.com in your browser
#   2. DevTools → Application → Cookies → copy `__Secure-next-auth.session-token`
#   3. Repo → Settings → Secrets and variables → Actions → update
#      JKT48_SESSION_COOKIE
# Cookie typically lasts ~30 days.

on:
  schedule:
    # 00:00, 06:00, 12:00, 18:00 UTC every day
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-eli-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install scraper deps
        run: pip install -r scripts/requirements.txt

      - name: Scrape Eli schedule
        env:
          JKT48_SESSION_COOKIE: ${{ secrets.JKT48_SESSION_COOKIE }}
        run: python scripts/scrape-eli-schedule.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/data/eli-schedule.json; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data/eli-schedule.json
          git commit -m "chore(schedule): refresh Eli appearances from jkt48.com [skip ci]"
          git push
