<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3507" viewBox="0 0 2480 3507">
  <!-- Drawn in the first 342x730 draft base's units, like the older accessories; the transform puts it
       on the illustrated base (figure top 11 -> 171, feet 699 -> 3296, centre x 155 -> 1165.5). -->
  <defs>
    <linearGradient id="towelL" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e58c4c"/><stop offset="0.55" stop-color="#f7b27c"/><stop offset="1" stop-color="#ea9555"/></linearGradient>
    <linearGradient id="towelR" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ea9555"/><stop offset="0.45" stop-color="#f7b27c"/><stop offset="1" stop-color="#e58c4c"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4a86e"/><stop offset="1" stop-color="#d9793c"/></linearGradient>
  </defs>
  <g transform="translate(461.47 121.04) scale(4.5422)">
    <!-- A towel muffler (like the oshi towels fans bring to concerts): it goes behind the neck
         (neck edges x ~142-168), lies on both shoulders, and its two ends hang down the front. -->
    <g stroke="#a5582c" stroke-width="0.45" stroke-linejoin="round">
      <!-- the two ends hanging down the front, drawn first so the shoulder part lies over them -->
      <path d="M131.4 138 L 145.6 136.6 L 144.4 211 L 130.2 211.6 Z" fill="url(#towelL)"/>
      <path d="M178.6 138 L 164.4 136.6 L 165.6 211 L 179.8 211.6 Z" fill="url(#towelR)"/>
      <!-- the part lying on each shoulder: from the side of the neck, over the shoulder, behind the neck -->
      <path d="M142.4 125.8 C 135.6 127.4 128 131.4 122.6 137.2 C 124 141.4 127.6 144.2 131.6 145 C 135.4 141.2 140.2 139 145.2 138.4 Z" fill="url(#fold)"/>
      <path d="M167.6 125.8 C 174.4 127.4 182 131.4 187.4 137.2 C 186 141.4 182.4 144.2 178.4 145 C 174.6 141.2 169.8 139 164.8 138.4 Z" fill="url(#fold)"/>
    </g>
    <g fill="none" stroke="#ffd2a8" stroke-width="0.5" opacity="0.7" stroke-linecap="round">
      <path d="M140.6 127.6 C 135 129.2 129 132.6 125.2 137"/><path d="M169.4 127.6 C 175 129.2 181 132.6 184.8 137"/>
