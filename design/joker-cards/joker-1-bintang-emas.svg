      <path d="M38 62 l3.2 8 8.6 .5 -6.7 5.5 2.2 8.4 -7.3-4.7 -7.3 4.7 2.2-8.4 -6.7-5.5 8.6-.5z" fill="#7C2D34"/>
    </g>
  </g>
  <!-- star with a smile -->
  <path d="M150.0,100.0 L171.2,152.9 L228.0,156.7 L184.2,193.1 L198.2,248.3 L150.0,218.0 L101.8,248.3 L115.8,193.1 L72.0,156.7 L128.8,152.9 Z"
