  <text x="150" y="312" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-weight="900" font-size="38" letter-spacing="6" fill="#5A3D0C">JOKER</text>
  <text x="150" y="338" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="13" fill="#7C2D34">cocok dengan siapa saja</text>
