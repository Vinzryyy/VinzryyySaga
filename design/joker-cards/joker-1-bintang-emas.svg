      </g>
    </pattern>
  </defs>
  <rect width="300" height="400" rx="22" fill="url(#bg)"/>
  <rect width="300" height="400" rx="22" fill="url(#rays)"/>
  <rect x="12" y="12" width="276" height="376" rx="14" fill="none" stroke="#7C2D34" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="18" y="18" width="264" height="364" rx="10" fill="none" stroke="#7C2D34" stroke-opacity="0.25" stroke-width="1"/>
  <!-- corner indices -->
  <g font-family="Fraunces, Georgia, serif" font-weight="900" fill="#7C2D34">
