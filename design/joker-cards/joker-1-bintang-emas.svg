    <path d="M70 230 l2.4 8 8 2.4 -8 2.4 -2.4 8 -2.4-8 -8-2.4 8-2.4z"/>
    <path d="M222 252 l2 6 6 2 -6 2 -2 6 -2-6 -6-2 6-2z"/>
