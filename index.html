    <style>
      /* Preloader — inline so it paints before the JS bundle parses.
         Removed from the DOM by src/main.jsx after React mounts. */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #FDF6E3 0%, #F5E6C8 100%);
        font-family: "Fraunces Variable", "Fraunces", Georgia, serif;
        color: #3D342B;
        transition: opacity 0.6s ease, visibility 0.6s ease;
      }
      #preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .preloader-inner {
        text-align: center;
        animation: pre-fade-in 0.8s ease-out both;
        padding: 0 1.5rem;
      }
      .preloader-blossom {
        display: inline-block;
        font-size: 1.1rem;
        color: #8B4040;
        opacity: 0.7;
        margin-bottom: 1.25rem;
        letter-spacing: 0.6em;
        animation: pre-blossom 2.4s ease-in-out infinite;
      }
      .preloader-wordmark {
        margin: 0;
        font-size: clamp(2.5rem, 7vw, 4.5rem);
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1;
        font-variation-settings: "opsz" 144, "SOFT" 50;
      }
      .preloader-dot {
        color: #8B4040;
      }
      .preloader-tagline {
        margin: 0.75rem 0 1.75rem;
        font-style: italic;
        color: #8B4040;
        font-size: 0.9rem;
        letter-spacing: 0.06em;
      }
      .preloader-bar {
        width: 140px;
        height: 1px;
        margin: 0 auto;
        background: rgba(139, 64, 64, 0.15);
        overflow: hidden;
        border-radius: 1px;
      }
      .preloader-bar > span {
        display: block;
        width: 40%;
        height: 100%;
        background: #8B4040;
        animation: pre-bar 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .preloader-eyebrow {
        margin-top: 1.25rem;
        font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 10px;
        font-style: normal;
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: #8B7D6B;
      }
      @keyframes pre-fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pre-blossom {
        0%, 100% { opacity: 0.5; transform: scale(1); }
        50%      { opacity: 1;   transform: scale(1.12); }
      }
      @keyframes pre-bar {
        0%   { transform: translateX(-150%); }
        100% { transform: translateX(400%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-inner,
        .preloader-blossom,
        .preloader-bar > span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Memuat Armeniaca">
      <div class="preloader-inner">
        <div class="preloader-blossom" aria-hidden="true">✦ ✦ ✦</div>
        <h1 class="preloader-wordmark">
          Armeniaca<span class="preloader-dot">.</span>
        </h1>
        <p class="preloader-tagline">#BloomInSpring</p>
        <div class="preloader-bar" aria-hidden="true"><span></span></div>
        <p class="preloader-eyebrow">Arsip Visual · Eli JKT48</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
