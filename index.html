    <style>
      /* Preloader — inline so it paints before the JS bundle parses.
         Removed from the DOM by src/main.jsx after React mounts +
         a min-display window (so users actually see the splash). */
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 50% 28%, rgba(201, 169, 97, 0.22) 0%, transparent 55%),
          linear-gradient(180deg, #5C4A3A 0%, #3D342B 100%);
        font-family: "Fraunces Variable", "Fraunces", Georgia, serif;
        color: #FDF6E3;
        transform-origin: center;
        transition:
          opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1),
          visibility 0.8s cubic-bezier(0.4, 0, 0.2, 1),
          transform 0.8s cubic-bezier(0.4, 0, 0.2, 1),
          filter 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      }
      #preloader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
        transform: scale(1.06);
        filter: blur(8px);
      }
      .preloader-inner {
        text-align: center;
        padding: 0 1.5rem;
        max-width: min(92vw, 480px);
        animation: pre-rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .preloader-logo {
        display: block;
        width: clamp(220px, 42vw, 380px);
        height: auto;
        margin: 0 auto 1rem;
        filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.3));
        animation: pre-logo-in 1.2s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .preloader-tagline {
        margin: 0.5rem 0 2rem;
        font-style: italic;
        color: #E5C575;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        animation: pre-fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.35s both;
      }
      .preloader-bar {
        width: 160px;
        height: 1px;
        margin: 0 auto;
        background: rgba(253, 246, 227, 0.14);
        overflow: hidden;
        border-radius: 1px;
        animation: pre-fade-up 0.7s ease-out 0.5s both;
      }
      .preloader-bar > span {
        display: block;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #C9A961, #E5C575);
        transform: scaleX(0);
        transform-origin: left center;
        animation: pre-bar-fill 1.6s cubic-bezier(0.65, 0, 0.35, 1) 0.5s forwards;
      }
      .preloader-eyebrow {
        margin-top: 1.5rem;
        font-family: "Plus Jakarta Sans Variable", "Plus Jakarta Sans", system-ui, sans-serif;
        font-size: 10px;
        font-style: normal;
        text-transform: uppercase;
        letter-spacing: 0.36em;
        color: rgba(253, 246, 227, 0.55);
        animation: pre-fade-up 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.7s both;
      }
      @keyframes pre-rise {
        from { opacity: 0; transform: translateY(14px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pre-logo-in {
        from {
          opacity: 0;
          transform: scale(0.92);
          filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.3)) blur(6px);
        }
        to {
          opacity: 1;
          transform: scale(1);
          filter: drop-shadow(0 6px 24px rgba(0, 0, 0, 0.3)) blur(0);
        }
      }
      @keyframes pre-fade-up {
        from { opacity: 0; transform: translateY(8px); }
        to   { opacity: 1; transform: translateY(0); }
      }
      @keyframes pre-bar-fill {
        from { transform: scaleX(0); }
        to   { transform: scaleX(1); }
      }
      @media (prefers-reduced-motion: reduce) {
        .preloader-inner,
        .preloader-logo,
        .preloader-tagline,
        .preloader-bar,
        .preloader-bar > span,
        .preloader-eyebrow {
          animation: none;
        }
        .preloader-bar > span { transform: scaleX(1); }
        #preloader.is-hidden { transform: none; filter: none; }
      }
    </style>
  </head>
  <body>
    <div id="preloader" role="status" aria-label="Memuat Armeniaca">
      <div class="preloader-inner">
        <img
          class="preloader-logo"
          src="/logo-armeniaca.png"
          alt="Armeniaca"
          width="380"
          height="146"
        />
        <p class="preloader-tagline">#BloomInSpring</p>
        <div class="preloader-bar" aria-hidden="true"><span></span></div>
        <p class="preloader-eyebrow">Arsip Visual · Eli JKT48</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
