<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Armeniaca</title>
    <meta name="robots" content="noindex, nofollow" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      html, body {
        height: 100%;
        background: #0a0a0a;
        color: #f5f5f5;
        font-family: "Georgia", serif;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
      }

      .container {
        text-align: center;
        padding: 2rem;
        user-select: none;
      }

      .label {
        font-size: clamp(0.65rem, 1.5vw, 0.85rem);
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: #555;
        margin-bottom: 2.5rem;
      }

      .headline {
        font-size: clamp(3rem, 12vw, 10rem);
        font-weight: 900;
        letter-spacing: -0.02em;
        line-height: 0.9;
        color: #f5f5f5;
        text-transform: uppercase;
      }

      .headline span {
        display: block;
      }

      .divider {
        width: 60px;
        height: 2px;
        background: #444;
        margin: 2.5rem auto;
      }

      .sub {
        font-size: clamp(0.75rem, 1.8vw, 1rem);
        color: #444;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        font-family: system-ui, sans-serif;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <p class="label">armeniaca.online</p>
      <h1 class="headline">
        <span>ARMENIACA</span>
        <span>SHUTDOWN</span>
      </h1>
      <div class="divider"></div>
      <p class="sub">Site tidak tersedia</p>
    </div>
  </body>
</html>
